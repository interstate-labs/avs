# docker-compose.yaml for AVS project

services:
  # Karak Services
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly
    platform: linux/amd64
    ports:
      - "8546:8545"
    volumes:
      - ./:/dss
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    working_dir: /dss/onchain/contracts
    command: anvil --no-cors

  contract-builder:
    image: node:22.5-slim
    user: "node"
    platform: linux/amd64
    volumes:
      - ./:/dss
    working_dir: /dss/onchain/contracts
    depends_on:
      - anvil
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3 &&
        yarn &&
        echo "success" > /dss/builder.status

  contract-deployer:
    image: ghcr.io/foundry-rs/foundry:nightly
    user: "root" 
    platform: linux/amd64
    volumes:
      - ./:/dss
    working_dir: /dss/onchain/contracts
    depends_on:
      - anvil
    entrypoint:
      - /bin/sh
      - -c
      - |
        while [ ! -f /dss/builder.status ] || [ $(cat /dss/builder.status) != 'success' ]; do
        echo 'Waiting for contract-builder to complete...';
        sleep 2;
        done &&
        forge script script/deploy.sol --rpc-url http://anvil:8545 --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 --broadcast --skip-simulation &&
        rm /dss/builder.status &&
        echo "success" > /dss/deploy.status

  karak-aggregator:
    image: square-number-dss-aggregator
    build:
      context: ./karak_offchain
      dockerfile: aggregator/Dockerfile
    platform: linux/amd64
    volumes:
      - ./:/dss
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10s
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - HEARTBEAT=5000
      - RPC_URL=http://anvil:8545
      - CORS_ORIGIN=*
      - COMMON_RATE_LIMIT_WINDOW_MS=1000
      - COMMON_RATE_LIMIT_MAX_REQUESTS=10000
      - PRIVATE_KEY=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      - BLOCK_NUMBER_STORE=/dss/onchain/contracts/block-number-store.json
      - RUST_LOG=info
      - SQUARE_NUMBER_DSS_ADDRESS=0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE
      - TXN_VERIFIER_ADDRESS=0x3Aa5ebB10DC797CAC828524e59A333d0A371443c
      - CORE_ADDRESS=0x9bd03768a7DCc129555dE410FF8E85528A4F88b5
    depends_on:
      - contract-deployer
      - anvil
    entrypoint: >
      sh -c "
        # Initialize the block-number-store.json file with the required structure
        echo '{\"block_number\": 0}' > /dss/onchain/contracts/block-number-store.json &&
        
        # Wait for contract deployment to complete
        while [ ! -f /dss/deploy.status ] || [ \$(cat /dss/deploy.status) != 'success' ]; do 
          echo 'Waiting for contract-deployer to complete...'; 
          sleep 2; 
        done && 
        
        # Start the aggregator
        /app/square-number-dss-aggregator
      "

  karak-operator-1:
    image: square-number-dss-operator
    build:
      context: ./karak_offchain
      dockerfile: operator/Dockerfile
    platform: linux/amd64
    volumes:
      - ./:/dss
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DOMAIN_URL=http://karak-operator-1:8080
      - RPC_URL=http://anvil:8545
      - CORS_ORIGIN=*
      - COMMON_RATE_LIMIT_WINDOW_MS=1000
      - COMMON_RATE_LIMIT_MAX_REQUESTS=10000
      - AGGREGATOR_URL=http://karak-aggregator:3000
      - HEARTBEAT=1000
      - PRIVATE_KEY=0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
      - RUST_LOG=info
      - SQUARE_NUMBER_DSS_ADDRESS=0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE
      - TXN_VERIFIER_ADDRESS=0x3Aa5ebB10DC797CAC828524e59A333d0A371443c
      - CORE_ADDRESS=0x9bd03768a7DCc129555dE410FF8E85528A4F88b5
      - RUST_BACKTRACE=full
    depends_on:
      karak-aggregator:
        condition: service_healthy

  karak-operator-2:
    image: square-number-dss-operator
    build:
      context: ./karak_offchain
      dockerfile: operator/Dockerfile
    platform: linux/amd64
    volumes:
      - ./:/dss
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - DOMAIN_URL=http://karak-operator-2:8081
      - RPC_URL=http://anvil:8545
      - CORS_ORIGIN=*
      - COMMON_RATE_LIMIT_WINDOW_MS=1000
      - COMMON_RATE_LIMIT_MAX_REQUESTS=10000
      - AGGREGATOR_URL=http://karak-aggregator:3000
      - HEARTBEAT=1000
      - PRIVATE_KEY=0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6
      - RUST_LOG=info
      - SQUARE_NUMBER_DSS_ADDRESS=0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE
      - TXN_VERIFIER_ADDRESS=0x3Aa5ebB10DC797CAC828524e59A333d0A371443c
      - CORE_ADDRESS=0x9bd03768a7DCc129555dE410FF8E85528A4F88b5
      - RUST_BACKTRACE=full
    depends_on:
      karak-aggregator:
        condition: service_healthy

  # Eigen Services
  eigen-offchain:
    build:
      context: ./eigen_offchain
      dockerfile: Dockerfile
    volumes:
      - ./eigen_offchain:/usr/src/app
    environment:
      - HOLESKY_RPC_URL=${HOLESKY_RPC_URL:-https://ethereum-holesky-rpc.publicnode.com}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - PRIVATE_KEY=${PRIVATE_KEY}
    depends_on:
      - anvil

  # Symbiotic Services
  symbiotic-restaking:
    build: 
      context: ./symbiotic_offchain
      dockerfile: Dockerfile
    # Removed explicit container_name to let Docker Compose generate a unique name
    restart: unless-stopped
    environment:
      - PRIVATE_KEY=eaaa2702cad0c15b0cd341673c46d6936f87be6c3334c41a616201ea6931297a
      - ETHEREUM_RPC_URL=https://ethereum-sepolia-rpc.publicnode.com
      - CONTRACT_ADDRESS=0x0237cdb6Eea2B719fe660A91cD05c2CC607C35d8
      - RUST_LOG=info
    volumes:
      - ./symbiotic_offchain/logs:/app/logs
    depends_on:
      - anvil