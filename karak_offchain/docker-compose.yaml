version: '3.8'

services:
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    container_name: karak-aggregator
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - HOST=0.0.0.0
      - HEARTBEAT=5000
      - RPC_URL=https://ethereum-holesky-rpc.publicnode.com
      - CORS_ORIGIN=*
      - COMMON_RATE_LIMIT_WINDOW_MS=1000
      - COMMON_RATE_LIMIT_MAX_REQUESTS=10000
      - PRIVATE_KEY=6d35c1bdf469031cfe3cbaddd57ca69a36835a39c2a6f2cefc17c804851b0635
      - BLOCK_NUMBER_STORE=/app/block-number-store.json
      - RUST_LOG=info
      - SQUARE_NUMBER_DSS_ADDRESS=0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE
      - TXN_VERIFIER_ADDRESS=0xCbb651f2F7FEd1264224D20F75BEF371549E71C9
      - CORE_ADDRESS=0x9bd03768a7DCc129555dE410FF8E85528A4F88b5
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  operator:
    build:
      context: .
      dockerfile: operator/Dockerfile
    container_name: karak-operator
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - HOST=0.0.0.0
      - DOMAIN_URL=http://0.0.0.0:3009
      - AGGREGATOR_URL=http://aggregator:3008
      - HEARTBEAT=5000
      - RPC_URL=https://ethereum-holesky-rpc.publicnode.com
      - CORS_ORIGIN=*
      - COMMON_RATE_LIMIT_WINDOW_MS=1000
      - COMMON_RATE_LIMIT_MAX_REQUESTS=10000
      - PRIVATE_KEY=6d35c1bdf469031cfe3cbaddd57ca69a36835a39c2a6f2cefc17c804851b0635
      - BLOCK_NUMBER_STORE=/app/block-number-store.json
      - RUST_LOG=info
      - SQUARE_NUMBER_DSS_ADDRESS=0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE
      - TXN_VERIFIER_ADDRESS=0xCbb651f2F7FEd1264224D20F75BEF371549E71C9
      - CORE_ADDRESS=0x9bd03768a7DCc129555dE410FF8E85528A4F88b5
      - RUST_BACKTRACE=full
    volumes:
      - ./data:/app/data
    depends_on:
      - aggregator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data: